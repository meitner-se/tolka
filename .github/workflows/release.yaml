name: Release

on:
    push:
        branches:
            - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    # Nothing publishes unless the checks passed on this exact commit. The
    # release job runs on a push to main, where the pull_request checks do not.
    test:
        uses: ./.github/workflows/test.yaml
    lint:
        uses: ./.github/workflows/lint.yaml
    typecheck:
        uses: ./.github/workflows/typecheck.yaml

    release:
        name: Release
        needs: [test, lint, typecheck]
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: write
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            # No `registry-url`: it makes setup-node write an .npmrc carrying
            # `_authToken=${NODE_AUTH_TOKEN}` and `always-auth=true`, so npm
            # authenticates with an empty token instead of falling through to
            # OIDC. The default registry is already registry.npmjs.org.
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24.x
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Create Release Pull Request or Publish
              id: changesets
              uses: changesets/action@v1
              with:
                  publish: "npx changeset publish"
                  title: "Version Packages"
                  commit: "Version Packages"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: "" # Workaround. See https://github.com/changesets/changesets/issues/1152#issuecomment-3190884868
