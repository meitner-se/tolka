name: Typecheck

on:
    pull_request:

jobs:
    typecheck:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # The type-level machinery is the product, and runtime tests
                # exercise none of it. Without the matrix the supported range
                # is a hope, not a policy.
                typescript: ["5.6", "5.7", "5.8", "5.9", "next"]
        name: Typecheck (TypeScript ${{ matrix.typescript }})
        steps:
            - uses: actions/checkout@v4
            - name: Install pnpm
              uses: pnpm/action-setup@v4
            - name: Set-up Node 24.x
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - name: Install
              run: pnpm install --frozen-lockfile
            - name: Pin TypeScript ${{ matrix.typescript }}
              run: pnpm add -D typescript@${{ matrix.typescript }} --ignore-scripts
            - name: Typecheck
              run: pnpm typecheck
